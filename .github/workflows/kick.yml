name: kick
on:
  schedule:
    - cron: "4,24,44 * * * *"
  workflow_dispatch:
concurrency:
  group: kick
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: dispatch the bots
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          ts=$(date -u +%FT%TZ)
          if [ -z "$TOKEN" ]; then echo "$ts no DISPATCH_TOKEN yet (timer test only)" | tee -a fired.log; exit 0; fi
          for wf in gas.yml rain.yml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/kellenandrews/kalshi-paper/actions/workflows/$wf/dispatches \
              -d '{"ref":"main"}')
            echo "$ts $wf -> HTTP $code" | tee -a fired.log
          done
      - name: record the firing
        run: |
          git config user.name kick; git config user.email kick@users.noreply.github.com
          tail -n 500 fired.log > f && mv f fired.log
          git add fired.log && git commit -qm "fired $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q || true
